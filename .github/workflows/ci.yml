name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
        stylelint: [16, 17]
    name: test (node ${{ matrix.node }}, stylelint ${{ matrix.stylelint }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm install --no-save stylelint@${{ matrix.stylelint }}
      - run: npx stylelint --version
      - run: npm test
